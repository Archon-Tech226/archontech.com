databases:
  - name: archontech-db
    plan: free
    databaseName: archontech
    user: archontech

services:
  - type: web
    name: archontech-web
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: archontech-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Creates your admin login on deploy (Render free has no shell). Set the password
      # in the Render dashboard; it is never stored in the repo.
      - key: DJANGO_SUPERUSER_USERNAME
        value: "abinaya"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "founder.archon@gmail.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Optional — fill these in later if you want lead-notification emails.
      # Leave blank to skip emailing and just save leads to the database.
      - key: EMAIL_HOST_USER
        value: ""
      - key: EMAIL_HOST_PASSWORD
        value: ""
      - key: LEAD_NOTIFICATION_EMAIL
        value: "founder.archon@gmail.com"
